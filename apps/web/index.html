<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Khatafy - shared room expense diary for students, roommates and flatmates." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Khatafy</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('kh.theme') || 'light';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Khatafy needs JavaScript. / Khatafy ko JavaScript chahiye.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
